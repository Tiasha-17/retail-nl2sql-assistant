[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-nl2sql"
version = "0.1.0"
description = "A guarded natural-language interface for the Olist retail star schema"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.8",
  "httpx==0.28.1",
  "openai==2.48.0",
  "pydantic-settings==2.11.0",
  "sqlglot==30.20.0",
  "uvicorn==0.39.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "ruff==0.16.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
